name: Check public workflow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install Pillow numpy pyyaml opencc-python-reimplemented
      - name: Check the public package
        run: |
          python -B scripts/check_public_release.py
          python -B scripts/check_portability.py --static-only
      - name: Run regression tests
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
